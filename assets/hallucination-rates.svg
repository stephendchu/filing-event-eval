<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="660" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#1b1f23">Ungrounded claim rate by parse path</text>
  <text x="40" y="62" font-size="13" fill="#586069">Share of extracted claims the grounding gate flagged as un-citable (lower is better)</text>

  <!-- Plot area: x from 200 to 620 maps 0%..50% -->
  <!-- Gridlines -->
  <g stroke="#e1e4e8" stroke-width="1">
    <line x1="200" y1="100" x2="200" y2="240"/>
    <line x1="284" y1="100" x2="284" y2="240"/>
    <line x1="368" y1="100" x2="368" y2="240"/>
    <line x1="452" y1="100" x2="452" y2="240"/>
    <line x1="536" y1="100" x2="536" y2="240"/>
    <line x1="620" y1="100" x2="620" y2="240"/>
  </g>
  <g font-size="11" fill="#959da5" text-anchor="middle">
    <text x="200" y="258">0%</text>
    <text x="284" y="258">10%</text>
    <text x="368" y="258">20%</text>
    <text x="452" y="258">30%</text>
    <text x="536" y="258">40%</text>
    <text x="620" y="258">50%</text>
  </g>

  <!-- AAPL bar: 46% -> width = 0.92 * 420 = 386.4 -->
  <text x="184" y="135" font-size="14" font-weight="600" fill="#1b1f23" text-anchor="end">AAPL</text>
  <text x="184" y="151" font-size="11" fill="#959da5" text-anchor="end">HTML parse</text>
  <rect x="200" y="112" width="386" height="36" rx="3" fill="#d73a49"/>
  <text x="576" y="135" font-size="15" font-weight="700" fill="#ffffff" text-anchor="end">46%</text>

  <!-- MSFT bar: 9% -> width = 0.18 * 420 = 75.6 -->
  <text x="184" y="195" font-size="14" font-weight="600" fill="#1b1f23" text-anchor="end">MSFT</text>
  <text x="184" y="211" font-size="11" fill="#959da5" text-anchor="end">clean XBRL parse</text>
  <rect x="200" y="172" width="76" height="36" rx="3" fill="#28a745"/>
  <text x="288" y="195" font-size="15" font-weight="700" fill="#1b1f23" text-anchor="start">9%</text>

  <!-- Caption -->
  <text x="40" y="288" font-size="12" fill="#586069">The 37-point gap is parsing-driven — which is why numbers are sourced from structured XBRL, not HTML.</text>
</svg>
